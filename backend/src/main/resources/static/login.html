<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - BorrowBuddy</title>

    <link rel="stylesheet" href="/css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>BorrowBuddy</h1>

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to your BorrowBuddy account
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>

            </form>

            <p id="message"></p>

            <p class="switch-page">

                Don't have an account?

                <a href="/register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>

    <script src="/js/auth.js"></script>

</body>

</html>
