
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Item - BorrowBuddy</title>

    <link rel="stylesheet" href="/css/auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>BorrowBuddy</h1>

        <h2>Add an Item</h2>

        <p class="subtitle">
            Share something useful with your campus community
        </p>

        <form id="addItemForm">

            <div class="form-group">

                <label for="name">
                    Item Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Example: Scientific Calculator"
                    required
                >

            </div>

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    placeholder="Describe your item"
                    required
                >

                <!-- AI Description Generator Button -->
                <button
                    type="button"
                    id="generateDescriptionBtn"
                    class="auth-button">

                    ✨ Generate with AI

                </button>

                <p id="aiDescriptionStatus"></p>

            </div>

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    placeholder="Example: Electronics"
                    required
                >

            </div>

            <div class="form-group">

                <label for="imageUrl">
                    Image URL
                </label>

                <input
                    type="text"
                    id="imageUrl"
                    placeholder="Optional"
                >

            </div>

            <button
                type="submit"
                class="auth-button">

                Add Item

            </button>

        </form>

        <p id="message"></p>

        <p class="switch-page">

            <a href="/dashboard.html">
                ← Back to Dashboard
            </a>

        </p>

    </div>

</div>

<script src="/js/add-item.js"></script>
<script src="/js/chatbot.js"></script>
</body>

</html>
